syntax = "proto2";

package cast;

message CastMessage {
  enum ProtocolVersion {
    CASTV2_1_0 = 0;
    CASTV2_1_1 = 1;
    CASTV2_1_2 = 2;
    CASTV2_1_3 = 3;
    CASTV2_1_4 = 4;
    CASTV2_1_5 = 5;
  }
  required ProtocolVersion protocol_version = 1 [default = CASTV2_1_5];
  required string source_id = 2;
  required string destination_id = 3;
  required string namespace = 4;
  enum PayloadType {
    STRING = 0;
    BINARY = 1;
  }
  required PayloadType payload_type = 5;
  optional string payload_utf8 = 6;
  optional bytes payload_binary = 7;
  optional bool continued = 8;
  optional bool remaining_length = 9;
}
