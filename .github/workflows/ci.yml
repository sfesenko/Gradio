name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            appstream \
            desktop-file-utils \
            gettext \
            libgdk-pixbuf-2.0-dev \
            libglib2.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer1.0-dev \
            libgtk-4-dev \
            libjson-glib-dev \
            libsoup-3.0-dev \
            meson \
            ninja-build \
            valac

      - name: Configure
        run: meson setup builddir

      - name: Compile
        run: meson compile -C builddir

      - name: Check helper scripts are POSIX sh
        run: dash -n po/check-pot.sh

      - name: Test
        run: meson test -C builddir --print-errorlogs

      - name: Validate appstream metadata
        run: appstreamcli validate --no-net builddir/data/io.github.sfesenko.gradio.appdata.xml

      - name: Check POTFILES drift
        run: ./po/check-pot.sh
